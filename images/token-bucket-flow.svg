<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <!-- Generator -->
  <rect x="240" y="20" width="120" height="36" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="300" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Generator</text>

  <line x1="300" y1="56" x2="300" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Bucket container -->
  <rect x="220" y="100" width="160" height="220" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Empty slots (top row) -->
  <circle cx="255" cy="150" r="14" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="300" cy="150" r="14" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="345" cy="150" r="14" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Filled tokens -->
  <circle cx="255" cy="190" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="300" cy="190" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="345" cy="190" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>

  <circle cx="255" cy="230" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="300" cy="230" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="345" cy="230" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>

  <circle cx="255" cy="270" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="300" cy="270" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <circle cx="345" cy="270" r="14" fill="#fde68a" stroke="#b45309" stroke-width="1"/>

  <text x="300" y="345" text-anchor="middle" font-size="12" fill="#334155">Bucket — capacity 12, currently 9 tokens</text>

  <!-- Arrow to request -->
  <line x1="380" y1="210" x2="458" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- New request box -->
  <rect x="460" y="142" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="530" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">New request</text>

  <!-- Branch arrows -->
  <line x1="490" y1="182" x2="472" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="530" y1="182" x2="592" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Allowed box -->
  <rect x="425" y="225" width="95" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="472" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Allowed</text>
  <text x="472" y="262" text-anchor="middle" font-size="11" fill="#166534">-1 token</text>

  <!-- Rejected box -->
  <rect x="545" y="225" width="95" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="592" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Rejected</text>
  <text x="592" y="262" text-anchor="middle" font-size="11" fill="#991b1b">no tokens</text>

  <!-- Legend -->
  <circle cx="60" cy="380" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="75" y="384" font-size="11" fill="#334155">token present</text>
  <circle cx="190" cy="380" r="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="205" y="384" font-size="11" fill="#334155">empty slot (below capacity)</text>
</svg>
