<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <!-- Outer machine boundary -->
  <rect x="40" y="30" width="600" height="230" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="58" font-size="15" font-weight="600" fill="#334155">Your machine</text>

  <!-- JVM box -->
  <rect x="70" y="90" width="230" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="185" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">JVM process</text>
  <text x="185" y="140" text-anchor="middle" font-size="12" fill="#1e40af">runs Main.java</text>
  <text x="185" y="175" text-anchor="middle" font-size="12" fill="#1e40af">Jedis client</text>
  <text x="185" y="193" text-anchor="middle" font-size="12" fill="#1e40af">opens a socket</text>

  <!-- Docker box -->
  <rect x="380" y="90" width="230" height="140" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
  <text x="495" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">Docker container</text>
  <text x="495" y="140" text-anchor="middle" font-size="12" fill="#115e59">redis-poc</text>
  <text x="495" y="175" text-anchor="middle" font-size="12" fill="#115e59">Redis server process</text>
  <text x="495" y="193" text-anchor="middle" font-size="12" fill="#115e59">in-memory data store</text>

  <!-- Connection arrows -->
  <line x1="300" y1="160" x2="378" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="378" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="339" y="215" text-anchor="middle" font-size="12" fill="#334155">TCP :6379</text>
</svg>
